# Only trust the forwarding protocol supplied by the shared edge proxy.
map $http_x_forwarded_proto $quiz_forwarded_proto {
    default $scheme;
    https https;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    client_max_body_size 32k;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
    location = /api { return 308 /api/; }
    location ^~ /api/ {
        # Runtime DNS also allows the offline profile to start without an API.
        set $api_upstream son-durak-api:3001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $quiz_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        add_header X-Robots-Tag 'noindex, nofollow' always;
        add_header Cache-Control 'no-store' always;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control 'public, max-age=31536000, immutable';
    }
    location = /precache-assets.json { add_header Cache-Control 'no-cache'; try_files $uri =404; }
    location = /sw.js { add_header Cache-Control 'no-cache'; try_files $uri =404; }
    location = /data/network.json { add_header Cache-Control 'no-cache'; try_files $uri =404; }
    # React pages and quiz permalinks must return the app on a direct visit.
    location ~ ^/(?:hatlar|yolculugum|kaynaklar|hakkinda)/?$ {
        add_header Cache-Control 'no-cache';
        try_files $uri /index.html =404;
    }
    location ~ "^/(?:quick|daily|survival|expert|district|duel)/[a-zA-Z0-9-]{1,100}(?:/sonuc)?/?$" {
        add_header Cache-Control 'no-cache';
        add_header X-Robots-Tag 'noindex, nofollow' always;
        try_files $uri /index.html =404;
    }
    location / {
        add_header Cache-Control 'no-cache';
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
    location = /404.html { internal; add_header X-Robots-Tag noindex always; }
}
