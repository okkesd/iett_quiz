name: Deploy Son Durak
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'İlk kurulum: prepare → sunucuda HTTPS kurulumu → deploy'
        required: true
        default: deploy
        type: choice
        options: [prepare, deploy]
permissions:
  contents: read
concurrency:
  group: son-durak-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      QUIZ_DOMAIN: ${{ vars.QUIZ_DOMAIN || 'iettquiz.duckdns.org' }}
      EDGE_NETWORK: ${{ vars.EDGE_NETWORK || 'auto' }}
      EDGE_CONTAINER: ${{ vars.EDGE_CONTAINER || 'nginx' }}
      EDGE_STACK_DIR: ${{ vars.EDGE_STACK_DIR }}
      IMAGE_PREFIX: ${{ secrets.DOCKER_USERNAME }}
      RELEASE_TAG: ${{ github.sha }}-${{ github.run_number }}-${{ github.run_attempt }}
      # Requested production mode: no account, progress saved in the browser.
      DEPLOY_MODE: offline
      DOCKER_PLATFORM: ${{ vars.DOCKER_PLATFORM || 'linux/amd64' }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate and prepare deployment configuration
        run: |
          python3 deploy/scripts/configure.py
          for file in deploy/scripts/*.sh; do bash -n "$file"; done
          python3 -m unittest discover -s tests -p 'test_deploy.py'
          docker compose --env-file deploy/.env -f deploy/compose.yml config --quiet
      - uses: actions/setup-node@v6
        if: inputs.operation == 'deploy'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test frontend
        if: inputs.operation == 'deploy'
        working-directory: frontend
        run: |
          npm ci
          npm test
      - uses: docker/setup-qemu-action@v3
        if: inputs.operation == 'deploy' && vars.DOCKER_PLATFORM == 'linux/arm64'
      - uses: docker/setup-buildx-action@v3
        if: inputs.operation == 'deploy'
      - name: Login to Docker Hub
        if: inputs.operation == 'deploy'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push web image
        if: inputs.operation == 'deploy'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          platforms: ${{ env.DOCKER_PLATFORM }}
          tags: ${{ env.IMAGE_PREFIX }}/son-durak-web:${{ env.RELEASE_TAG }}
          build-args: |
            SITE_URL=https://${{ env.QUIZ_DOMAIN }}
            API_BASE_URL=
            AUTH_MODE=supabase
          cache-from: type=gha,scope=son-durak-web
          cache-to: type=gha,mode=max,scope=son-durak-web
      - name: Test image behind an isolated nginx proxy
        if: inputs.operation == 'deploy'
        run: |
          docker pull --platform "$DOCKER_PLATFORM" "$IMAGE_PREFIX/son-durak-web:$RELEASE_TAG"
          bash deploy/scripts/smoke-test.sh "$IMAGE_PREFIX/son-durak-web:$RELEASE_TAG" "$QUIZ_DOMAIN"
      - name: Package release
        run: |
          umask 077
          tar --exclude='__pycache__' -czf release.tgz deploy/compose.yml deploy/.env deploy/scripts deploy/nginx deploy/README.md
      - name: Prepare remote directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || '22' }}
          script: |
            set -eu
            umask 077
            mkdir -p "$HOME/son-durak"
      - name: Copy release
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || '22' }}
          source: release.tgz
          target: son-durak
      - name: Extract release
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || '22' }}
          script: |
            set -eu
            umask 077
            cd "$HOME/son-durak"
            if [ -f deploy/.env.last-successful ]; then
              cp deploy/.env.last-successful deploy/.env.previous
            fi
            tar -xzf release.tgz
            rm release.tgz
            chmod 600 deploy/.env
      - name: Deploy through SSH
        if: inputs.operation == 'deploy'
        uses: appleboy/ssh-action@v1
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || '22' }}
          envs: DOCKER_USERNAME,DOCKER_PASSWORD
          command_timeout: 15m
          script: |
            set -eu
            : "${DOCKER_USERNAME:?}" "${DOCKER_PASSWORD:?}"
            printf '%s' "$DOCKER_PASSWORD" | docker login --username "$DOCKER_USERNAME" --password-stdin
            unset DOCKER_PASSWORD
            cd "$HOME/son-durak"
            bash deploy/scripts/deploy.sh
      - name: Write deployment summary
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          if [[ "$OPERATION" == deploy ]]; then
            printf '### Son Durak yayında\n\nhttps://%s\n\nImage: `%s/son-durak-web:%s`\n' "$QUIZ_DOMAIN" "$IMAGE_PREFIX" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '### Sunucu dosyaları hazır\n\n`~/son-durak/deploy` kopyalandı. `deploy/README.md` içindeki bootstrap → Certbot → HTTPS adımlarını tamamlayıp bu workflow’u **deploy** ile çalıştır.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Remove generated configuration
        if: always()
        run: rm -f deploy/.env release.tgz
